<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Banner</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Promo banner: colorful, no text, no logo (Wix shows name and logo below it). */
  html, body { width: 540px; height: 360px; }
  .m { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-8deg); border-radius: 26px; overflow: hidden; border: 6px solid #fff; box-shadow: 0 24px 60px rgba(10,20,60,.4); }
  .chip { position: absolute; right: 54px; bottom: 44px; width: 150px; height: 58px; border-radius: 16px; background: #fff; box-shadow: 0 16px 36px rgba(10,20,60,.35); display: flex; align-items: center; gap: 10px; padding: 0 14px; color: var(--brand); }
  .chip span { flex: 1; display: grid; gap: 7px; }
  .chip span i { display: block; height: 8px; border-radius: 4px; background: oklch(0.9 0.01 250); }
  .chip span i:first-child { width: 80%; background: oklch(0.8 0.05 258); }
  .truck { position: absolute; left: 50px; top: 46px; width: 74px; height: 74px; border-radius: 20px; background: oklch(0.42 0.17 260); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 30px rgba(10,20,60,.35); border: 4px solid #fff; }
</style>
</head>
<body>
  <div class="m"><div class="map" data-w="380" data-h="260" data-vb="20 20 960 657" data-labels="off"></div></div>
  <div class="truck"><i data-i="truck" data-s="36"></i></div>
  <div class="chip"><i data-i="route" data-s="24"></i><span><i></i><i></i></span></div>
<script src="shell.js"></script><script src="icons.js"></script><script src="map.js"></script>
</body>
</html>
